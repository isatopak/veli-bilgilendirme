<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1C1C1E">
    <title>Veli Bilgilendirme Sistemi</title>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root { 
            --surface: rgba(28, 28, 30, 0.7); --primary: #0A84FF; --text-main: #FFFFFF; --text-muted: rgba(235, 235, 245, 0.7); 
            --ios-green-gradient: linear-gradient(135deg, #30D158, #32ADE6); --ios-blue-gradient: linear-gradient(135deg, #0A84FF, #5E5CE6);
            --ios-dark-gradient: linear-gradient(135deg, #2C2C2E, #1C1C1E);
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; -webkit-tap-highlight-color: transparent; }
        html { background-color: #1e1e24; height: 100%; overscroll-behavior-y: none; }
        body { margin: 0; background: linear-gradient(-45deg, #2b2b36, #1e1e24, #2d232e, #1f2228); background-size: 400% 400%; animation: gradientBG 15s ease infinite; background-attachment: fixed; color: var(--text-main); max-width: 500px; margin: 0 auto; min-height: 100vh; position: relative; }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        
        .announcements-slider { display: flex; overflow-x: auto; gap: 12px; padding: 4px 4px 16px 4px; scroll-snap-type: x mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch; margin-bottom: 8px; }
        .announcements-slider::-webkit-scrollbar { display: none; }
        .announcement-card { flex: 0 0 88%; scroll-snap-align: start; background: rgba(94, 92, 230, 0.15); backdrop-filter: blur(25px); border: 1px solid rgba(94, 92, 230, 0.4); border-radius: 22px; padding: 18px; text-align: left; box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2); }
        .announcement-card.latest { border: 1px solid rgba(255, 69, 58, 0.5) !important; background: rgba(255, 69, 58, 0.1) !important; }
        
        .app-header { background-color: rgba(28, 28, 30, 0.5); backdrop-filter: blur(25px); padding: 16px 20px; border-bottom: 0.5px solid rgba(255,255,255,0.1); position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .header-text-group { display: flex; flex-direction: column; flex: 1; text-align: left; }
        .app-title-modern { font-size: 16px; font-weight: 700; color: #fff; letter-spacing: -0.5px; }
        #syncStatus { font-size: 10px; font-weight: 600; background: rgba(255,255,255,0.1); color: #EBEBF5; padding: 4px 8px; border-radius: 100px; display:none; margin-top: 6px; width: fit-content; }
        .live-indicator { display: inline-block; width: 8px; height: 8px; background-color: #30D158; border-radius: 50%; margin-right: 6px; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        .logout-btn { font-size: 11px; font-weight: 700; background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); color: var(--text-main); padding: 8px 12px; border-radius: 100px; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; display: flex; align-items: center; gap: 6px; outline: none; border: none; }
        
        .container { padding: 16px; }
        .glass-panel { background-color: var(--surface); backdrop-filter: blur(25px); border-radius: 24px; padding: 24px; margin-bottom: 16px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.15); }
        .setup-icon-amblem { font-size: 54px; display: flex; align-items: center; justify-content: center; width: 110px; height: 110px; border-radius: 30px; background: var(--ios-dark-gradient); box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5); border: 1px solid rgba(255,255,255,0.1); margin: 0 auto 24px auto; }
        
        .form-group { margin-bottom: 16px; text-align: left; }
        .form-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 8px; color: #FFFFFF; text-transform: uppercase; }
        input, select { 
            width: 100%; padding: 16px; border-radius: 14px; border: 2px solid rgba(255,255,255,0.3); 
            background-color: #1C1C1E; color: #FFFFFF; font-size: 16px; outline: none; 
        }
        select option { background-color: #2C2C2E; color: #FFFFFF; font-size: 16px; }
        input::placeholder { color: rgba(255,255,255,0.5); }

        .btn-vista { width: 100%; padding: 16px; border: none; border-radius: 14px; font-size: 16px; font-weight: 600; cursor: pointer; color: #FFF; background-color: var(--primary); display: flex; justify-content: center; gap: 8px; outline: none; box-shadow: 0 4px 15px rgba(10, 132, 255, 0.4);}
        
        .dashboard-grid-modern { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 24px; }
        .stat-card-modern { padding: 20px; border-radius: 20px; text-align: center; display: flex; flex-direction: column; justify-content: center; box-shadow: 0 8px 16px rgba(0,0,0,0.15); }
        .stat-avg { background: var(--ios-green-gradient); color: #FFF; }
        .stat-pnt { background: var(--ios-blue-gradient); color: #FFF; }
        .stat-label-modern { font-size: 13px; font-weight: 600; opacity: 0.9; text-transform: uppercase; margin-bottom: 4px; }
        .stat-value-modern { font-size: 38px; font-weight: 800; margin: 4px 0 0 0; letter-spacing: -1px; }
        .glass-header { font-weight: 600; font-size: 15px; text-align: left; margin-bottom: 12px; margin-top: 24px; display: flex; justify-content: space-between; align-items: center; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;}
        .history-list-modern { display: flex; flex-direction: column; gap: 12px; }
        .history-item-modern { padding: 18px; border-radius: 18px; text-align: left; display: flex; justify-content: space-between; align-items: center; backdrop-filter: blur(15px); }
        .history-yapti { background: rgba(48, 209, 88, 0.25); border: 1px solid rgba(48, 209, 88, 0.4); }
        .history-eksik { background: rgba(255, 69, 58, 0.25); border: 1px solid rgba(255, 69, 58, 0.4); }
        .history-yok { background: rgba(255, 159, 10, 0.25); border: 1px solid rgba(255, 159, 10, 0.4); }
        .history-left-modern { display: flex; flex-direction: column; gap: 6px; }
        .history-date-modern { font-size: 12px; color: rgba(255,255,255,0.8); font-weight: 500; }
        .history-subject-modern { font-size: 15px; font-weight: 600; color: #FFF; }
        .history-right-modern { font-size: 22px; }
        .loading-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 100; display: none; align-items: center; justify-content: center; flex-direction: column; }
        .spinner { border: 4px solid rgba(255,255,255,0.1); width: 40px; height: 40px; border-radius: 50%; border-left-color: var(--primary); animation: spin 1s linear infinite; margin-bottom: 16px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="app-header">
        <div class="header-text-group">
            <span class="app-title-modern">Veli Bilgilendirme Sistemi</span>
            <span id="syncStatus"></span>
        </div>
        <button id="logoutBtn" class="logout-btn" onclick="logoutParent()" style="display:none;">🔄 Yeniden Bağlan</button>
    </div>
    <div id="loadingOverlay" class="loading-overlay"><div class="spinner"></div><div style="font-weight: 600; font-size: 16px;">Sisteme Kaydediliyor...</div></div>

    <div class="container">
        <div id="screen-parent-setup" style="display:block;">
            <div class="glass-panel" style="margin-top:20px;">
                <div class="setup-icon-amblem">📲👤</div>
                <h2 style="margin-top:0; font-size: 24px; letter-spacing:-0.5px;">Cihaz Eşleştirme</h2>
                
                <div class="form-group">
                    <label>Sınıf Seçiniz</label>
                    <select id="parentSetupClass" onchange="loadParentSetupStudents()">
                        <option value="" disabled selected>Lütfen Seçin...</option>
                        <option value="5B">5B</option><option value="5C">5C</option>
                        <option value="5D">5D</option><option value="5E">5E</option>
                        <option value="5YDA">5YDA</option><option value="6A">6A</option>
                        <option value="7E">7E</option><option value="TEST">TEST</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Öğrenci Seçiniz</label>
                    <select id="parentSetupStudent">
                        <option value="" disabled selected>Önce sınıf seçin...</option>
                    </select>
                </div>
                
                <div class="form-group" style="margin-top: 20px;">
                    <label>Veli Adı ve Soyadı</label>
                    <input type="text" id="parentNameInput" placeholder="Örn: Murat Yılmaz">
                </div>
                
                <button class="btn-vista" onclick="saveParentSetup()" style="margin-top:24px;">🔗 Kaydet ve Bağlan</button>
            </div>
        </div>
        
        <div id="screen-parent-dashboard" style="display:none;"><div id="parentDashboardContainer"></div></div>
    </div>

<script>
    const BOT_KULLANICI_ADI = "EsenkentIngilizce_bot"; 

    const classData = {
        "5B": ["103 - Bekirhan Veziroğlu", "119 - Berfin Ocak", "138 - Ece Nur Macit", "195 - Eymen Akyol", "216 - Hüseyin Metin Ünlü", "228 - Mehmet Ali Acar", "229 - Mehmet Boran Şengül", "282 - Münür Eldemir", "292 - Ömer Toprak Kurubal", "311 - Zeynep Sena İlçin", "343 - Doruk Ateş", "351 - Feyza Kuruçay", "363 - Hüseyin Kayra Demir", "366 - Çınar Gülseren", "367 - Elif Sare Korkut", "415 - Asya Gökmen", "420 - Begüm Güldiken", "428 - Buğra Çınar", "430 - Büşranur Kapucu", "452 - Emir Talha Zengin", "475 - Melinay Perçin", "485 - Muhammet Yunus Ünal", "496 - Ramazan Kağan Kaya", "510 - Erşan Ali Yücel", "511 - Melisa Nur Kutlu", "512 - Efe Can Sukan", "542 - Erva Öztürk"],
        "5C": ["36 - Ada Temoçin", "88 - Badenur Kaya", "128 - Buğlem Altındaş", "135 - Defne Aktaş", "198 - Gamzenur Yıldız", "224 - Kerem Talha Akyıldız", "246 - Mehmet Timur Yalçın", "262 - Miraç Ege Taşhan", "263 - Miran Durma", "265 - Muhammed Arif Kavaklı", "307 - Solin Rohiv Görür", "344 - Ömer Kayra Mutlu", "355 - Timur Ula", "373 - Seyit Ali Şahin", "413 - Zeynep Cansu Bekdemir", "419 - Azra Geliç", "425 - Berk Emir Arıkan", "438 - Ecrin Ercan", "439 - Edip Yusuf Aydemir", "477 - Mira Su Ürentürk", "487 - Nazlı Ula", "488 - Nehir Armağan Bayır", "492 - Poyraz Ayçetin", "495 - Ramazan İsot", "499 - Semih Şentürk", "501 - Umut Yavaş", "508 - Zeynep Nisa Arancı"],
        "5D": ["87 - Ayşegül Altunyuva", "116 - Berat Kurubal", "118 - Belinay Sarıbulak", "137 - Derin Mebrule Alper", "187 - Eyüp Arda Karabulut", "222 - Furkan Yakupoğlu", "274 - Resul Güven", "289 - Nazlı Çevik", "291 - Kaan Efe Keten", "360 - Elif Kocaman", "376 - Yusuf Buğra Demirci", "390 - Adanaz Gezer", "414 - Asrın Kurşun", "417 - Ayaz Aksoy", "434 - Devran Çetin", "440 - Ege Özel", "464 - Hümeyra Nas Baloğlu", "466 - Tuana Dundar", "490 - Osman Meral", "493 - Poyraz Karamuk", "498 - Rumeysa Akdemir", "504 - Yağmur Hilal Geçmez", "507 - Zehra Şenses", "541 - Çağrı Karapınar", "543 - Gönül Keleş"],
        "5E": ["52 - Afşin Kuruca", "142 - Ela Nur Yıldız", "159 - Elif İlhan", "165 - Erva Acar", "169 - Eslimnur Kaya", "170 - Esma Çakal", "175 - Turgut Kaplan", "179 - Hira Elif Kartal", "201 - Hasan Etem Kurubal", "210 - Hira Sena Üzel", "269 - Muhammed Miraç Şirin", "278 - Murat Yıldız", "286 - Nasuh Buğra Yılmaz", "299 - Özgün Ada Erol", "313 - Muhammed Eymen Aslan", "319 - Ömer Sefa Gündüz", "328 - Elif Naz Gedik", "333 - Eda Nil Gedik", "357 - Eylül Çalışkan", "388 - Tuğçe Karakaya", "395 - Muhammet Talha Örün", "408 - Ali Kemal Aydoğdu", "421 - Selim Yıldırım", "448 - Elifnaz Akgül", "449 - Talha Karaca", "469 - Kaan Demir", "489 - Neslihan İşcan", "513 - Taha Tatay"],
        "5YDA": ["124 - Berkay Karagöz", "189 - Çınar Ali Demir", "209 - Sevgi Şener", "433 - Derin Somer", "451 - Emir Diler", "216 - Hüseyin Metin Ünlü", "292 - Ömer Toprak Kurubal", "363 - Hüseyin Kayra Demir", "415 - Asya Gökmen", "428 - Buğra Çınar", "475 - Melinay Perçin", "246 - Mehmet Timur Yalçın", "373 - Seyit Ali Şahin", "499 - Semih Şentürk", "501 - Umut Yavaş", "116 - Berat Kurubal", "414 - Asrın Kurşun", "440 - Ege Özel", "466 - Tuana Dündar", "170 - Esma Çakal", "408 - Ali Kemal Aydoğdu", "59 - Ahsen Ece Özbek", "75 - Almira Aydın", "111 - Bengü Kılıç", "153 - Elif İkra Bektaş", "202 - Hilal Erva Kurubal", "312 - Efecan Halitoğulları", "410 - Zehra Karabulut", "422 - Beren Dere", "494 - Poyraz Kartal"],
        "6A": ["2 - Ahmet Ayaz Altıntaş", "4 - Ahmet Dere", "5 - Anıl Ergin Aksoy", "11 - Ayaz Nergiz", "14 - Can Karakaya", "17 - Çınar Yüce", "30 - Derin Eren", "35 - Dilara Aydın", "48 - Ela Nur Özbek", "62 - Ezgi Özenses", "63 - Nas Maya Kurubal", "70 - Rüzgar Can", "73 - Saliha Uysal", "84 - Selen Özdemir", "91 - Umut Bozkurt", "93 - Yiğit Er", "94 - Yusuf Hamza Özbek", "96 - Zeynep Balta", "102 - Zeynep Kalender", "105 - İlkim Nehir Tepe", "107 - Ekin Fırat Koç", "109 - Serin Üzel", "125 - Rüzgar İnan Şık", "126 - Nisa Yağmur Ülker", "127 - Eslem Nisa Altındaş", "140 - Ata Can Özdemir", "147 - Sare Karabulut", "238 - Elif Bahar Ceylan", "370 - Solin Deniz Koçin", "389 - Yusuf Uras Kılıç"],
        "7E": ["34 - Arin Eray Erdoğan", "53 - Mert Ali Balta", "60 - Beyza Gül Kalyon", "69 - Ahmet Ediz Arısoy", "101 - Asenat Aras", "112 - Barış Kazankaya", "161 - Hayrunnisa Toraman", "230 - Muhammed Mahmudov", "247 - Eda Ece Balyemez", "284 - Hafsa Öçal", "340 - Sinem Gül", "341 - Sudenaz Gürsoy", "342 - Sümeyye Kadem Işık", "345 - Tuana Şahin", "348 - Yağız Kaya", "364 - Yusuf Kuzey Özdemir", "365 - Yusuf Özkan Koç", "368 - Tolgahan Paslı", "409 - Efe Mesut Yıldırım", "441 - Dila Taşdemir", "693 - Mustafa Özgür Kütük", "884 - Fadime Eldemir"],
        "TEST": ["999 - Test Öğrencisi"]
    };

    const firebaseConfig = { apiKey: "AIzaSyChlq2QkcalYkUm7LUW8fM1K2-SNVXmHBc", databaseURL: "https://odevtakipsistemi-b9fff-default-rtdb.europe-west1.firebasedatabase.app", projectId: "odevtakipsistemi-b9fff" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database(); const dbRef = db.ref('odevData');

    let savedHistories = []; let pendingAssignments = []; let participationScores = {}; let announcements = [];

    function linkYakalayici(metin) { if (!metin) return ""; var urlRegex = /(https?:\/\/[^\s]+)/g; return metin.replace(urlRegex, function(url) { return '<br><a href="' + url + '" target="_blank" style="display: inline-block; margin-top: 8px; padding: 6px 12px; background: rgba(0,0,0,0.3); color: white; border-radius: 8px; text-decoration: none; font-size: 13px; font-weight: bold; border: 1px solid rgba(255,255,255,0.2);">Git 🔗</a>'; }); }
    function calculateStreak(className, studentName) { let streak = 0; for(let i=0; i<savedHistories.length; i++) { let r = savedHistories[i]; if(r.className === className) { let asgn = r.assignment || ""; if(!asgn.includes('EKSİK') && !asgn.includes('MATERYAL')) { let s = r.details.find(x => x.name === studentName); if(s && !s.isAbsent) { if(s.isDone) streak++; else break; } } } } return streak; }
    function getVeliStreakBadge(streak) { if (streak >= 5) return `<div style="font-size:14px; font-weight:700; color:#FFD700; margin-top:8px;">🔥 ${streak} Ödevlik Seri!</div>`; return ''; }

    window.onload = function() { checkParentStatus(); };

    function checkParentStatus() { 
        let pData = localStorage.getItem('parentStudent'); 
        if (pData) { 
            pData = JSON.parse(pData); 
            document.getElementById('screen-parent-setup').style.display = 'none'; 
            document.getElementById('screen-parent-dashboard').style.display = 'block'; 
            document.getElementById('logoutBtn').style.display = 'flex'; 
            startSync(); 
        } else { 
            document.getElementById('screen-parent-setup').style.display = 'block'; 
            document.getElementById('screen-parent-dashboard').style.display = 'none'; 
            document.getElementById('syncStatus').style.display = 'none'; 
            document.getElementById('logoutBtn').style.display = 'none'; 
        } 
    }
    
    function logoutParent() { if(confirm("Bağlantıyı kesmek istiyor musunuz?")) { localStorage.removeItem('parentStudent'); location.reload(); } }
    
    function loadParentSetupStudents() { 
        var cls = document.getElementById('parentSetupClass').value; 
        var stuSelect = document.getElementById('parentSetupStudent'); 
        
        stuSelect.innerHTML = '<option value="" disabled selected>Öğrenci Seçiniz...</option>'; 
        
        if(cls && classData[cls]) { 
            classData[cls].forEach(function(s) { 
                var opt = document.createElement('option'); 
                opt.value = s; 
                opt.innerHTML = s; 
                stuSelect.appendChild(opt); 
            }); 
        }
    }
    
    function saveParentSetup() { 
        var cls = document.getElementById('parentSetupClass').value; 
        var stu = document.getElementById('parentSetupStudent').value; 
        var pName = document.getElementById('parentNameInput').value.trim(); 
        
        if(!cls || !stu) return alert("Lütfen Sınıf ve Öğrenci seçin!"); 
        if(!pName) return alert("Lütfen Veli adını girin!"); 
        
        document.getElementById('loadingOverlay').style.display = 'flex'; 
        setTimeout(function() { 
            document.getElementById('loadingOverlay').style.display = 'none'; 
            localStorage.setItem('parentStudent', JSON.stringify({className: cls, studentName: stu, parentName: pName})); 
            checkParentStatus(); 
        }, 1000); 
    }

    function startSync() { document.getElementById('syncStatus').style.display = 'inline-block'; document.getElementById('syncStatus').innerHTML = '<span class="live-indicator"></span>'; dbRef.on('value', (snapshot) => { if (snapshot.exists()) { var data = snapshot.val(); savedHistories = data.history || []; pendingAssignments = data.pending || []; participationScores = data.scores || {}; announcements = data.announcements || []; renderParentDashboard(); } }); }

    function renderParentDashboard() {
        let pData = localStorage.getItem('parentStudent'); if(!pData) return; pData = JSON.parse(pData);
        const className = pData.className; const studentName = pData.studentName; const container = document.getElementById('parentDashboardContainer');
        
        // İŞTE BÜTÜN SORUNU KÖKTEN ÇÖZEN O KISACIK KOD! Şifre yok, base64 yok. Sadece sınıf ve numara: (Örn: 5B_138)
        let studentId = studentName.split(' - ')[0];
        let telegramPayload = className + "_" + studentId;
        
        let html = ''; let total = 0; let doneCount = 0; let matIssues = 0;
        for(let i=0; i<savedHistories.length; i++) { const record = savedHistories[i]; if(record.className === className) { let studentDetail = record.details.find(s => s.name === studentName); if (studentDetail) { let asgRaw = record.assignment || ""; let isMaterial = asgRaw.includes("EKSİK") || asgRaw.includes("MATERYAL"); let asg = linkYakalayici(asgRaw); if(!isMaterial) { if(!studentDetail.isAbsent) { total++; if (studentDetail.isDone) doneCount++; } } else if (!studentDetail.isDone) { matIssues++; } let bgClass = ""; let icon = ""; let lbl = ""; if (isMaterial && !studentDetail.isDone) { bgClass = "history-eksik"; icon = "❌"; } else if (!isMaterial) { if (studentDetail.isAbsent) { bgClass = "history-yok"; icon = "➖"; } else if (studentDetail.isDone) { bgClass = "history-yapti"; icon = "✅"; } else { bgClass = "history-eksik"; icon = "❌"; } } if(bgClass !== "") { html += `<div class='history-item-modern ${bgClass}'><div class='history-left-modern'><div class='history-date-modern'>${record.date}</div><div class='history-subject-modern'>${asg}</div></div><div class='history-right-modern'>${icon}</div></div>`; } } } }

        let annHtml = ''; let myAnns = announcements.filter(a => { if(a.targetClasses) return a.targetClasses.includes(className) || a.targetClasses.includes('TÜMÜ'); return false; }).reverse();
        if(myAnns.length > 0) { annHtml = `<div class="announcements-slider">`; myAnns.forEach((a, index) => { let isLatest = (index === 0) ? 'latest' : ''; annHtml += `<div class="announcement-card ${isLatest}"><div style="font-weight:bold; color:#fff; font-size:13px; margin-bottom:8px;">📢 DUYURU ${myAnns.length - index}</div><div style="font-size:15px; font-weight:600;">${linkYakalayici(a.message)}</div><div style="font-size:11px; margin-top:10px;">🕒 ${a.date}</div></div>`; }); annHtml += `</div>`; }

        let pScore = (participationScores[className] && participationScores[className][studentName]) ? participationScores[className][studentName] : 0;
        const cleanName = studentName.split(' - ').length > 1 ? studentName.split(' - ')[1] : studentName;
        let streakIcon = getVeliStreakBadge(calculateStreak(className, studentName));

        container.innerHTML = `${annHtml}
        <div style="text-align:center; margin-bottom:30px; padding-top:10px;">
            <div style="font-size:64px; margin-bottom:10px;">👤</div>
            <h2 style="margin:0; color:var(--text-main); font-size:28px;">${cleanName}</h2>
            <p style="color:rgba(255,255,255,0.7); margin:6px 0 0 0;">${className} Sınıfı</p>
            ${streakIcon}
            
            <div style="margin-top:16px;">
                <a href="https://t.me/${BOT_KULLANICI_ADI}?start=${telegramPayload}" 
                   target="_blank" 
                   style="display:inline-flex; align-items:center; gap:8px; background:#24A1DE; color:white; padding:10px 18px; border-radius:100px; text-decoration:none; font-size:13px; font-weight:700; box-shadow:0 4px 15px rgba(36, 161, 222, 0.4);">
                    <span style="font-size: 16px;">🔔</span> Telegram Bildirimlerini Aktif Et
                </a>
            </div>
        </div>
        <div class="dashboard-grid-modern"><div class='stat-card-modern stat-avg'><div class='stat-label-modern'>Ödev Oranı</div><div class='stat-value-modern'>%${total === 0 ? 0 : Math.round((doneCount / total) * 100)}</div></div><div class='stat-card-modern stat-pnt'><div class='stat-label-modern'>Katılım Puanı</div><div class='stat-value-modern'>${pScore > 0 ? '+'+pScore : pScore}</div></div></div>
        <div class='glass-header'>✅ Kontrol Geçmişi</div><div class="history-list-modern">${html || '<div style="text-align:center; color:gray;">Kayıt bulunamadı.</div>'}</div>`;
    }
</script>
