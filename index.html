    let savedHistories = [];

    function linkYakalayici(metin) {
        if (!metin) return "";
        var urlRegex = /(https?:\/\/[^\s]+)/g;
        return metin.replace(urlRegex, function(url) {
            return '<br><a href="' + url + '" target="_blank" style="display: inline-block; margin-top: 8px; padding: 6px 12px; background: rgba(0,0,0,0.3); color: white; border-radius: 8px; text-decoration: none; font-size: 13px; font-weight: bold; border: 1px solid rgba(255,255,255,0.2);" onclick="event.stopPropagation();">Git 🔗</a>';
        });
    }

    function calculateStreak(className, studentName) {
        let streak = 0;
        for(let i=0; i<savedHistories.length; i++) {
            let r = savedHistories[i];
            if(r.className === className) {
                let asgn = r.assignment || "";
                if(!asgn.includes('EKSİK') && !asgn.includes('MATERYAL')) {
                    let s = r.details.find(x => x.name === studentName);
                    if(s && !s.isAbsent) {
                        if(s.isDone) streak++;
                        else break;
                    }
                }
            }
        }
        return streak;
    }

    function getVeliStreakBadge(streak) {
        if (streak >= 20) return `<div style="font-size:14px; font-weight:700; color:#FFD700; margin-top:8px; background:rgba(255, 215, 0, 0.15); display:inline-block; padding:6px 12px; border-radius:100px; border: 1px solid rgba(255,215,0,0.3); box-shadow: 0 4px 10px rgba(255, 215, 0, 0.2);">👑 ${streak} Efsanevi Seri!</div>`;
        if (streak >= 10) return `<div style="font-size:14px; font-weight:700; color:#00E5FF; margin-top:8px; background:rgba(0, 229, 255, 0.15); display:inline-block; padding:6px 12px; border-radius:100px; border: 1px solid rgba(0,229,255,0.3); box-shadow: 0 4px 10px rgba(0, 229, 255, 0.2);">💎 ${streak} Elmas Seri!</div>`;

    function checkParentStatus() {
        let pData = localStorage.getItem('parentStudent');
        if (pData) { 
            pData = JSON.parse(pData);

            document.getElementById('screen-parent-dashboard').style.display = 'block';

    function logoutParent() {
        if(confirm("Bağlantıyı kesmek ve bilgilerinizi yeniden girmek istiyor musunuz?")) {
            localStorage.removeItem('parentStudent');
            location.reload();
        }
    }

    function loadParentSetupStudents() {
        const cls = document.getElementById('parentSetupClass').value; 
        const stuSelect = document.getElementById('parentSetupStudent'); 
        stuSelect.innerHTML = '<option value="" disabled selected>Öğrenci Seçiniz...</option>';
        
        if(cls && classData[cls]) { 
            classData[cls].forEach(s => { 
                const opt = document.createElement('option'); 
                opt.value = s; 
                opt.innerHTML = s; 
                stuSelect.appendChild(opt); 
            }); 
            stuSelect.disabled = false;
            stuSelect.removeAttribute('disabled'); 
        } else {
            stuSelect.disabled = true;
            stuSelect.setAttribute('disabled', 'disabled');
        }
    }
    
    function saveParentSetup() {
        const cls = document.getElementById('parentSetupClass').value; 
        const stu = document.getElementById('parentSetupStudent').value;
        const pName = document.getElementById('parentNameInput').value.trim();

        if(!cls || !stu) return alert("Lütfen sınıf ve öğrenci seçin!");
        if(!pName) return alert("Lütfen veli adını ve soyadını girin!");

        if(confirm("Cihaz " + cls + " sınıfından seçtiğiniz öğrencinin verilerini okumak için kilitlenecektir. Onaylıyor musunuz?")) {
            document.getElementById('loadingOverlay').style.display = 'flex';
            
            db.ref('odevData_2026/parentConnections').once('value').then((snapshot) => {
                let connections = snapshot.val() || [];
                let exists = connections.find(c => c.className === cls && c.studentName === stu && c.parentName === pName);
                if (!exists) {
                    connections.push({className: cls, studentName: stu, parentName: pName, date: new Date().toLocaleDateString('tr-TR')});
                    db.ref('odevData_2026/parentConnections').set(connections);
                }
                setTimeout(function() { 
                    document.getElementById('loadingOverlay').style.display = 'none';
                    localStorage.setItem('parentStudent', JSON.stringify({className: cls, studentName: stu, parentName: pName})); 
                    checkParentStatus();
                }, 1500);
            }).catch(err => {
                alert("Bağlantı hatası! Lütfen internetinizi kontrol edin.");
                document.getElementById('loadingOverlay').style.display = 'none';
            });
        }
    }

    function startSync() { 
        document.getElementById('syncStatus').style.display = 'inline-block';
        document.getElementById('syncStatus').innerHTML = '<span class="live-indicator"></span>'; 
        
        dbRef.on('value', (snapshot) => {
            if (snapshot.exists()) {
                var data = snapshot.val();
                savedHistories = data.history || []; 
                pendingAssignments = data.pending || []; 
                participationScores = data.scores || {}; 
                announcements = data.announcements || [];
                
                if (document.getElementById('screen-parent-dashboard').style.display === 'block') {
                    renderParentDashboard(); 
                }
            }
        });
    }

    function renderParentDashboard() {
        let pData = localStorage.getItem('parentStudent'); if(!pData) return; pData = JSON.parse(pData);
        const className = pData.className; const studentName = pData.studentName; const container = document.getElementById('parentDashboardContainer');
        
        let html = ''; let total = 0; let doneCount = 0; let matIssues = 0;

        for(let i=0; i<savedHistories.length; i++) {
            const record = savedHistories[i];
            if(record.className === className) {
                let studentDetail = record.details.find(s => s.name === studentName);
                if (studentDetail) {
                    let asgRaw = record.assignment || "";
                    let isMaterial = asgRaw.includes("EKSİK") || asgRaw.includes("MATERYAL");
                    let asg = linkYakalayici(asgRaw); 
                    
                    if(!isMaterial) { 
                        if(!studentDetail.isAbsent) {
                            total++; 
                            if (studentDetail.isDone) doneCount++; 
                        }
                    } 
                    else if (!studentDetail.isDone) { matIssues++; }
                    
                    let bgClass = ""; let icon = ""; let lbl = "";

                    if (isMaterial && !studentDetail.isDone) {
                        bgClass = "history-eksik"; icon = "❌";
                    } else if (!isMaterial) {
                        if (studentDetail.isAbsent) {
                            bgClass = "history-yok"; icon = "➖";
                            lbl = " <span style='font-size:12px; font-weight:normal; opacity:0.9;'>(Devamsız)</span>";
                        } else if (studentDetail.isDone) {
                            bgClass = "history-yapti"; icon = "✅";
                        } else {
                            bgClass = "history-eksik"; icon = "❌";
                        }
                    }

                    if(bgClass !== "") {
                        html += `<div class='history-item-modern ${bgClass}'>
                            <div class='history-left-modern'>
                                <div class='history-date-modern'>${record.date}</div>
                                <div class='history-subject-modern'>${asg}${lbl}</div>
                            </div>
                            <div class='history-right-modern'>${icon}</div>
                        </div>`;
                    }
                }
            }
        }

        let annHtml = '';
        let myAnns = announcements.filter(a => {
            if(a.targetClasses) {
                return a.targetClasses.includes(className) || a.targetClasses.includes('TÜMÜ');
            } else if (a.className) {
                return a.className === className || a.className === 'TÜMÜ';
            }
            return false;
        }).reverse();

        if(myAnns.length > 0) {
            annHtml = `<div class="announcements-slider">`;
            myAnns.forEach((a, index) => {
                let isLatest = (index === 0) ? 'latest' : '';
                annHtml += `
                <div class="announcement-card ${isLatest}">
                    <div style="font-weight:bold; color:#fff; font-size:13px; margin-bottom:8px; display:flex; align-items:center; gap:6px;">
                        <span style="font-size:16px;">📢</span> DUYURU ${myAnns.length - index}
                    </div>
                    <div style="font-size:15px; font-weight:600; color:#fff; line-height:1.4; max-height: 90px; overflow-y: auto;">${linkYakalayici(a.message)}</div>
                    <div style="font-size:11px; color:rgba(255,255,255,0.6); margin-top:10px;">🕒 ${a.date}</div>
                </div>`;
            });
            annHtml += `</div>`;
        }

        const now = new Date(); const todayStr = new Date(now.getTime() - (now.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
        let pendingHtml = '';
        let pendingCount = 0; let sortedPending = [...pendingAssignments].sort((a,b) => new Date(a.dueDate) - new Date(b.dueDate));
        
        sortedPending.forEach(p => {
            if (p.className === className) {
                pendingCount++;
                let isTodayOrPast = p.dueDate <= todayStr;
                let boxClass = isTodayOrPast ? 'box-red' : 'box-yellow';
                let icon = isTodayOrPast ? '🚨' : '⏳';
                let dParts = p.dueDate.split('-'); let displayDate = `${dParts[2]}.${dParts[1]}.${dParts[0]}`;
                pendingHtml += `<div class="assignment-box ${boxClass}"><div class="box-date"><span>${icon} ${displayDate}</span></div><div class="box-title">${linkYakalayici(p.assignment)}</div></div>`;
            }
        });
        
        let pendingSection = pendingCount > 0 ? `<div class='glass-header'>📌 Yaklaşan Ödevler</div><div id="homeReminderList">${pendingHtml}</div>` : "";
        const cleanName = studentName.split(' - ').length > 1 ? studentName.split(' - ')[1] : studentName;

        let streak = calculateStreak(className, studentName);
        let streakIcon = getVeliStreakBadge(streak);

        let pScore = (participationScores[className] && participationScores[className][studentName]) ? participationScores[className][studentName] : 0;

        if (total === 0 && pendingCount === 0 && matIssues === 0 && pScore === 0) { 
            container.innerHTML = `${annHtml}<div style="text-align:center; margin-bottom:20px; padding-top:20px;"><div style="font-size:64px; margin-bottom:10px;">👤</div><h2 style="margin:0; color:var(--text-main); font-size:26px;">${cleanName}</h2><p style="color:var(--primary); margin:6px 0 0 0; font-size:15px; font-weight:600;">${className} Sınıfı</p></div><div class="glass-panel" style="text-align: center; color: var(--text-muted); padding: 40px 20px;">Öğrenciye ait henüz bir kayıt bulunmuyor.</div>`; 
        } else {
            const rate = total === 0 ? 0 : Math.round((doneCount / total) * 100);
            
            let matWarning = matIssues > 0 ? `<div class="glass-panel" style="border:1px solid rgba(255, 69, 58, 0.4); background:rgba(255, 69, 58, 0.15);"><h3 style="margin:0; color: #FFF; font-size:15px; text-shadow: 0 1px 3px rgba(0,0,0,0.5);">⚠️ DİKKAT: ${matIssues} Adet Materyal Eksiği Var!</h3></div>` : "";
            
            let statsHtml = `
            <div class="dashboard-grid-modern">
                <div class='stat-card-modern stat-avg'>
                    <div class='stat-label-modern'>Ödev Oranı</div>
                    <div class='stat-value-modern'>%${rate}</div>
                </div>
                <div class='stat-card-modern stat-pnt'>
                    <div class='stat-label-modern'>Katılım Puanı</div>
                    <div class='stat-value-modern'>${pScore > 0 ? '+'+pScore : pScore}</div>
                </div>
            </div>`;

            let studentHistory = [];
            savedHistories.forEach(r => {
                if(r.className === className && !r.assignment.includes('EKSİK') && !r.assignment.includes('MATERYAL')) {
                    let s = r.details.find(x => x.name === studentName);
                    if(s) studentHistory.push({ date: r.date, isDone: s.isDone, isAbsent: s.isAbsent });
                }
            });
            studentHistory = studentHistory.slice(0, 5).reverse();

            let chartHtml = `<div class="glass-panel" style="margin-top:24px;">
                <div class="glass-header" style="margin-top:0; justify-content:center;">📈 Son 5 Görev Trendi</div>
                <div style="display:flex; align-items:flex-end; justify-content:space-around; height:120px; padding-top:15px; gap:8px; border-bottom:1px solid rgba(255,255,255,0.1);">`;
            
            if(studentHistory.length === 0) {
                chartHtml += `<div style="width:100%; text-align:center; color:var(--text-muted); font-size:13px; align-self:center;">Henüz veri yok.</div>`;
            } else {
                studentHistory.forEach(h => {
                    let hColor = h.isAbsent ? 'var(--warning)' : (h.isDone ? 'var(--success)' : 'var(--danger)');
                    let hHeight = h.isAbsent ? '50%' : (h.isDone ? '100%' : '15%');
                    let icon = h.isAbsent ? '➖' : (h.isDone ? '✅' : '❌');
                    chartHtml += `<div style="display:flex; flex-direction:column; align-items:center; flex:1;">
                        <div style="font-size:14px; margin-bottom:4px;">${icon}</div>
                        <div style="width:100%; max-width:35px; height:${hHeight}; background:${hColor}; border-radius:6px 6px 0 0; opacity:0.85; box-shadow:0 0 10px ${hColor}; transition: height 1s ease;"></div>
                    </div>`;
                });
            }
            chartHtml += `</div>
                <div style="display:flex; justify-content:space-around; margin-top:8px;">`;
            studentHistory.forEach(h => {
                chartHtml += `<div style="font-size:9px; color:rgba(255,255,255,0.6);">${h.date.substring(0,5)}</div>`;
            });
            chartHtml += `</div></div>`;

            container.innerHTML = `${annHtml}
            <div style="text-align:center; margin-bottom:30px; padding-top:10px;">
                <div style="font-size:64px; margin-bottom:10px; filter: drop-shadow(0px 10px 10px rgba(0,0,0,0.3));">👤</div>
                <h2 style="margin:0; color:var(--text-main); font-size:28px; letter-spacing:-0.5px;">${cleanName}</h2>
                <p style="color:rgba(255,255,255,0.7); margin:6px 0 0 0; font-size:15px; font-weight:500;">${className} Sınıfı Raporu</p>
                ${streakIcon}
            </div>
            ${statsHtml}
            ${chartHtml}
            ${matWarning}
            ${pendingSection}
            <div class='glass-header'>✅ Kontrol Geçmişi</div>
            <div class="history-list-modern">${html}</div>`;
        }
    }
</script>
</body>
</html>
